name: Runner types

on:
  workflow_dispatch:

jobs:
  self-hosted:
    name: Raspberry Pi 4
    runs-on: atri-rpi
    steps:
      - run: echo "Hello atri-rpi"
  
  github-hosted:
    name: Ubuntu 24.04
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Hello ubuntu-24.04"

  running-in-container:
    name: Alpine
    runs-on: ubuntu-24.04
    container:
      image: alpine:latest
    steps:
      - run: echo "Hello container"

